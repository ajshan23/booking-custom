<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Flowflex Booking</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/portal.css"><script src="/login.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">▦ <span>Flowflex Booking</span></a><span class="internal">INTERNAL WORKSPACE</span></header>
  <main>
    <section class="login-card">
      <span class="eyebrow">SCHEDULING WORKSPACE</span><h1>Sign in</h1>
      <p>View customer meetings and manage when your team is available.</p>
      <div id="login-error" class="form-error" role="alert" hidden></div>
      <form id="login-form">
        <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="small">You stay signed in for 12 hours on this browser.</p>
    </section>
  </main>
  <footer>Flowflex Booking <a href="/privacy.html">Privacy policy</a></footer>
</body>
</html>
